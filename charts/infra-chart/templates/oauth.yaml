{{- if not (eq "logical" $.Values.environment) }}

---
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: ldap-provider
      mappingMethod: claim 
      type: LDAP
      ldap:
        attributes:
          id: 
            - dn
          email: 
            - mail
          name: 
            - cn
          preferredUsername: 
            - uid
        bindDN: "{{ $.Values.ldap.bindDN }}" 
        bindPassword: 
          name: ldap-secret
        insecure: {{ $.Values.ldap.insecure }} 
        url: "{{ $.Values.ldap.url }}" 
{{- end }}